<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiHome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("wikihome.theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        document.documentElement.style.backgroundColor = t === "light" ? "#ffffff" : "#1e1e1e";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
